services:
  python_app:
    build:
      context: .
      dockerfile: ./python/Dockerfile
    container_name: python_app_srat
    volumes:
      - ./python/entrypoint.sh:/entrypoint.sh
      - ./django/code:/code
    expose:
      - "8000"
    command: /bin/sh -c "pip install -r /code/requirements.txt  && chmod +x /entrypoint.sh && /entrypoint.sh"
  web:
    image: nginx:1.25.5
    container_name: python_nginx_01
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      # - ./web/html:/usr/share/nginx/html
      - ./django/code/sras/static:/static
      - ./logs/nginx:/var/log/nginx
    ports:
      - "80:80"
    depends_on:
      - python_app
